name: Últimos posts do blog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://seublog.com/feed.xml"
          max_post_count: 5
          template: "- [$title]($url) <sub>· $date</sub>"
          date_format: "dd/mm/yyyy"
